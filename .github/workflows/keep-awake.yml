name: Keep the agent server awake

# Render's free plan sleeps a service after 15 minutes without traffic. This pings it every 10 minutes
# (GitHub may run a scheduled job a few minutes late, so an external monitor pings it too).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 120 --retry 2 https://leash-agent.onrender.com/health
